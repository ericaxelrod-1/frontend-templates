# PostgREST — the API layer for this template (ADR-0004).
#
# Start it with:
#   PGRST_DB_URI=... PGRST_JWT_SECRET=... postgrest postgrest.conf
# or, in this repository, `npm run dev` / `npm run prod` in backend/ — which
# COMPOSE PGRST_DB_URI from DB_HOST, DB_PORT, DB_NAME and AUTHENTICATOR_PASSWORD
# and always name pgrst_authenticator. PGRST_JWT_SECRET is never written here
# either: a committed configuration file must not carry a password or a signing
# secret, and PGRST_JWT_SECRET must hold the same value as JWT_SECRET in
# backend/.env — the thin app asserts that at bootstrap.
#
# This file is the example committed with the template. The roles it names are
# created by backend/database/bootstrap/001_roles.sql, run ONCE AS A SUPERUSER —
# not by a migration: `CREATE ROLE` needs CREATEROLE, which is cluster-scoped,
# and the escalation-boundary GRANT needs ADMIN OPTION, so neither can run in a
# migration (AGENTS.md B1). Until they exist, PostgREST refuses to start, which
# is the intended failure rather than a silent one. rebase.md W06 records this
# machinery as SUPERSEDED, not done: the roles stand, what it was verified
# against does not.

# --- Database -------------------------------------------------------------

# Connection for the *request-serving* side of the system. Read the URI from
# PGRST_DB_URI, deliberately absent here so no password is committed. In this
# repository that variable is composed, not configured: see
# backend/scripts/postgrest-connection.ts.
#
# The user in that URI must own no table. A table's owner bypasses its own
# row-level security policies and Postgres reports nothing when that happens
# (ADR-0023, verified on a live install), so the request roles below are
# granted privileges on tables they do not own. It must also be a MEMBER of the
# three roles a token may assume, or the `SET ROLE` PostgREST issues is refused —
# which is why the login role is pgrst_authenticator and not the migration role.

# Only base tables are exposed. There are no views in this template: a
# superuser-created view bypasses every policy on its base table, silently
# (ADR-0022).
db-schemas = "public"

# The five roles. One is the migration/owner role; three serve requests; one is
# the authenticator. A DB role is IMPERSONATION AND GRANTS, nothing more: it
# selects which grants apply and which policies are evaluated. It carries no
# scope and no capability of its own.
#
#   app                     migration/owner role: owns the schema, applies the
#                           migrations, never receives a request
#   app_anon      unauthenticated callers                     -> db-anon-role
#   app_member    an authenticated caller, holding at least one role
#   app_admin     the superset principal: more of everything, never a bypass
#
# Authorization is two axes with two mechanisms and two key materials
# (AGENTS.md B2, ADR-0023), and neither is the `role` claim:
#
#   SCOPE      which ROWS a request may see. `CREATE POLICY` — Postgres RLS,
#              below the application. Keyed on `user_groups` membership joined
#              to `authz.org_closure` (a group and its descendants), NEVER on a
#              claim. The token supplies `sub` only; a membership change takes
#              effect on the next request with the same token.
#   CAPABILITY which TABLES, VERBS and COLUMNS. Object-level security: `GRANT`
#              plus `has_permission()`, resolved from `user_roles` -> `roles` ->
#              `role_permissions` -> `permissions`, inheriting up the role
#              hierarchy.
#
# Neither axis is computed from the other and no table puts them on one row.
# Collapsing them fails silently: never create a DB role named after a
# capability, and never store a PostgreSQL role name in `roles`, or nothing can
# answer "what can this role do?".
#
# app_anon / app_member / app_admin are the only values the `role` claim may
# ever carry: PostgREST issues SET ROLE for whatever the token names, so the
# issuer validates the claim on mint and an unknown role fails the request.
# Mint-time validation is necessary and NOT sufficient — the control is
# `GRANT app_anon, app_member, app_admin TO pgrst_authenticator` in
# 001_roles.sql, which is the escalation boundary (AGENTS.md B5).
db-anon-role = "app_anon"

# --- Authentication -------------------------------------------------------

# Read from PGRST_JWT_SECRET; see the header. Absent here on purpose.
# jwt-secret = "@pgrst_jwt_secret"

# The claim that selects the database role. Set explicitly: PostgREST's default
# is the ".role" claim, and this template's issuer emits a plain "role" claim.
#
# CORRECTED. The value must be a JSPath, not a bare claim name. The committed
# value was "role", which makes PostgREST 16.4 PANIC on boot rather than fall
# back:
#   failed to parse role-claim-key value (role) ... unexpected "r" / expecting "."
# The leading dot is what makes it a path. Verified on 16.4: ".role" serves,
# "role" and "$.role" both panic ("unexpected '.'"). The "$" JSONPath spelling
# is accepted only from a later release, so do not "modernise" this to "$.role".
jwt-role-claim-key = ".role"

# --- Server ---------------------------------------------------------------

server-host = "127.0.0.1"
server-port = 3001

# `NOTIFY pgrst, 'reload schema'` is how a migration makes a new table visible.
# It needs the notification channel, and it is the default; stating it keeps the
# requirement greppable (rebase.md §5.3.1).
db-channel-enabled = true

# --- Contract generation --------------------------------------------------

# The spec served at GET / is generated from the live schema, so it cannot drift
# from the database. `ignore-privileges` documents every table in db-schemas
# rather than only the ones the anon role can read, so the generated contract
# stays complete as grants are added.
openapi-mode = "ignore-privileges"
